# === Fuzzy Matching 설정 ===
matching_config:
  # 최소 유사도 임계값 (0-100)
  min_similarity_threshold: 80
  # 대소문자 무시
  case_insensitive: true
  # 공백 무시
  ignore_whitespace: true
