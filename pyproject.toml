[project]
name = "25-2-insightcon"
version = "0.1.0"
description = "온톨로지 기반 AI 금융 코파일럿 프로젝트"
authors = [
    {name = "shtmdgur",email = "tony34036@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # PDF 처리 (Phase 0)
    "pymupdf4llm>=0.2.0",  # 최신 레이아웃 처리 기능
    
    # 핵심 프레임워크
    "langgraph>=1.0.0",  # v1 stable 라인
    "langchain>=1.0.0,<2.0.0",  # v1 stable, 메이저 업 대비
    "langchain-neo4j>=0.6.0",  # 최신 안정 버전
    
    # 그래프 데이터베이스
    "neo4j>=5.24.0",
    "neo4j-graphrag>=1.10.0",  # 최신 스키마 기반 KGC 기능
    
    # 유틸리티
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0,<3.0.0",  # v2 stable
    "PyYAML>=6.0",  # Prompt 템플릿 파싱
    
    # LLM 통합 (Gemini 전용)
    "langchain-google-genai>=4.0.0",  # 신규 google-genai SDK 기반
    "langchain-google-vertexai>=2.0.0",  # Vertex AI LangChain 통합
    
    # LLM SDK (신규 Google GenAI SDK)
    "google-genai>=1.0.0",  # google-genai는 2025+ 표준
    "google-generativeai>=0.8.0", # 사용자 요청 추가
    "google-cloud-aiplatform>=1.70.0",  # Vertex AI 최신 기능
    
    # Phase 0: CSV 및 데이터 처리
    "pandas>=2.0.0,<3.0.0",
    "openpyxl>=3.1.0",  # Excel 파일 지원
    "Pillow>=10.0.0",   # 이미지 처리
    "langchain-experimental>=0.0.40",  # Pandas DataFrame Agent
    
    # Phase 1.2: 엔티티 정규화
    "fuzzywuzzy>=0.18.0",  # Fuzzy Matching
    "python-Levenshtein>=0.21.0",  # Levenshtein Distance (fuzzywuzzy 가속화)
    
    # Phase 1.3: 시계열 처리
    "saxpy>=1.0.0",  # SAX-DM (Symbolic Aggregate approXimation)
    "yfinance>=0.2.0",  # Yahoo Finance API
    "numpy>=1.24.0,<3.0.0",  # 시계열 계산
    
    # Phase 2: 에러 핸들링
    "tenacity>=8.2.0",  # Retry 전략
    
    # Phase 3: PDF Export 및 리포트 생성
    "weasyprint>=60.0",  # Markdown → PDF 변환
    "markdown>=3.5",  # Markdown 파싱
    "jinja2>=3.1",  # 템플릿 엔진
    
    # Phase 3: Graph 시각화
    "pyvis>=0.3.2",  # NetworkX 시각화
    "networkx>=3.0",  # 그래프 분석
    
    # Phase 4: Web App
    "streamlit>=1.39.0",  # Streamlit 데모 앱
    
    # Phase 5: LangGraph CLI/Studio (protobuf 충돌로 비활성화)
    # "langgraph-cli[inmem]>=0.4.0",  # LangGraph 개발 서버
    # "langgraph-api>=0.6.0",  # API 서버 (protobuf >= 6.32 요구)
    # "langgraph-sdk>=0.2.0",  # SDK
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
