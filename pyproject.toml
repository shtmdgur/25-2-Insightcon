[project]
name = "25-2-insightcon"
version = "0.1.0"
description = "온톨로지 기반 AI 금융 코파일럿 프로젝트"
authors = [
    {name = "shtmdgur",email = "tony34036@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # PDF 처리
    "pymupdf4llm>=0.0.8",
    
    # 핵심 프레임워크
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-neo4j>=0.1.0",
    
    # 그래프 데이터베이스
    "neo4j>=5.0.0",
    "neo4j-graphrag>=0.1.0",
    
    # 유틸리티
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    
    # LLM 통합
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    
    # LLM SDK
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
