[project]
name = "25-2-insightcon"
version = "0.1.0"
description = "온톨로지 기반 AI 금융 코파일럿 프로젝트"
authors = [
    {name = "shtmdgur",email = "tony34036@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # PDF 처리 (Phase 0)
    "pymupdf4llm>=0.0.8",
    
    # 핵심 프레임워크
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-neo4j>=0.1.0",
    
    # 그래프 데이터베이스
    "neo4j>=5.0.0",
    "neo4j-graphrag>=0.1.0",
    
    # 유틸리티
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    
    # LLM 통합
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    
    # LLM SDK
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
    
    # Phase 0: CSV 처리
    "pandas>=2.0.0",
    "langchain-experimental>=0.0.40",  # Pandas DataFrame Agent
    
    # Phase 1.2: 엔티티 정규화
    "fuzzywuzzy>=0.18.0",  # Fuzzy Matching
    "python-Levenshtein>=0.21.0",  # Levenshtein Distance (fuzzywuzzy 가속화)
    
    # Phase 1.3: 시계열 처리
    "saxpy>=1.0.0",  # SAX-DM (Symbolic Aggregate approXimation)
    "numpy>=1.24.0",  # 시계열 계산
    
    # Phase 2: 에러 핸들링
    "tenacity>=8.2.0",  # Retry 전략
    
    # Phase 3: PDF Export 및 리포트 생성
    "weasyprint>=60.0",  # Markdown → PDF 변환
    "markdown>=3.5",  # Markdown 파싱
    "jinja2>=3.1",  # 템플릿 엔진
    
    # Phase 3: Graph 시각화
    "pyvis>=0.3.2",  # NetworkX 시각화
    "networkx>=3.0",  # 그래프 분석
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
